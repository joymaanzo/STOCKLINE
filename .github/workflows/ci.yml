name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://stockline:stockline@localhost:5432/stockline
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stockline
          POSTGRES_USER: stockline
          POSTGRES_PASSWORD: stockline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockline -d stockline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q