services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockline
      POSTGRES_USER: stockline
      POSTGRES_PASSWORD: stockline
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockline -d stockline"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://stockline:stockline@postgres:5432/stockline
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: